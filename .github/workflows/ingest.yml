name: ingest

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NewsDesk Ingestion Pipeline
        run: >
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "${{ secrets.APP_URL }}/api/cron/ingest"

